<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lesson Planning and Approval System</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #302c07, #696132, #173617); /* Red, Yellow, Green gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: rgb(196, 193, 190);
            padding: 45px 40px;
            border-radius: 15px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .login-logo {
            width: 120px;
            margin-bottom: 20px;
        }

        .login-card h2 {
            margin-bottom: 25px;
            font-weight: 600;
            color: #333;
        }

        .btn-login {
            background: linear-gradient(to right, #6b4141, #575130, #4b5f4b);
            border: none;
            color: white;
            font-weight: bold;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .login-card a {
            color: #008000;
            text-decoration: none;
        }

        .login-card a:hover {
            text-decoration: underline;
        }

        .login-footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="https://golearnershub.com/wp-content/uploads/2020/07/GES-opens-recruitment.png" alt="GES Logo" class="login-logo">

        <h2>Lesson Planning and Approval System</h2>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3 text-start">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
            </div>

            <div class="mb-3 text-start">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="mb-3 text-end">
                <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
            </div>

            <button type="submit" class="btn btn-login w-100">Login</button>
        </form>
    </div>
</body>
</html>
