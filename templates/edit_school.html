<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit School</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">Edit School</span>
        <a href="{{ url_for('headmaster_dashboard') }}" class="btn btn-secondary btn-sm">Back to Dashboard</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            Edit School: {{ school.name }}
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">School Name</label>
                    <input type="text" name="name" class="form-control" value="{{ school.name }}" required>
                </div>

                <button class="btn btn-success">Save Changes</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
